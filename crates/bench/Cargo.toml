[package]
name = "bench"
description = "Benchmarks letmetalk, natively and in the browser, against iroh"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "letmetalk_bench"
crate-type = ["cdylib", "rlib"]

[features]
default = ["iroh"]
iroh = ["dep:iroh", "dep:iroh-relay"]

[dependencies]
futures = "0.3"
hex = "0.4"
letmetalk = { path = "../letmetalk", features = ["ws", "stats"] }
n0-future = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", default-features = false, features = ["io-util", "sync"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
clap = { version = "4", features = ["derive"] }
iroh = { version = "=1.3.0", default-features = false, features = ["tls-ring"], optional = true }
iroh-relay = { version = "=1.3.0", default-features = false, features = ["server"], optional = true }
tokio = { version = "1", features = ["full"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"
wasm-bindgen = "0.2.129"
wasm-bindgen-futures = "0.4"
