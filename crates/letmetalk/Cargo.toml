[package]
name = "letmetalk"
description = "Dial a public key over WebRTC, natively and in browsers"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
blake2 = "0.10"
ciborium = "0.2.2"
ed25519-dalek = "3"
getrandom = "0.4"
hex = "0.4"
ml-kem = { version = "0.3", features = ["getrandom", "zeroize"] }
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
snow = { version = "0.10", default-features = false, features = ["use-chacha20poly1305", "use-blake2", "use-curve25519", "use-getrandom"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.4", features = ["wasm_js"] }
getrandom03 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }
