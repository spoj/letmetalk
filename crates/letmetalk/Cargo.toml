[package]
name = "letmetalk"
description = "Dial a public key over WebRTC, natively and in browsers"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
stats = []
ws = ["dep:http", "dep:rustls", "dep:tokio-tungstenite", "dep:webpki-roots", "dep:x25519-dalek"]

[dependencies]
blake2 = "0.10"
ciborium = "0.2.2"
ed25519-dalek = "3"
futures = "0.3"
getrandom = "0.4"
hex = "0.4"
http = { version = "1", optional = true }
ml-kem = { version = "0.3", features = ["getrandom", "zeroize"] }
n0-future = "0.3"
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
x25519-dalek = { version = "2", features = ["static_secrets"], optional = true }
snow = { version = "0.10", default-features = false, features = ["use-chacha20poly1305", "use-blake2", "use-curve25519", "use-getrandom"] }
tokio = { version = "1", default-features = false }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
async-trait = "0.1"
bytes = "1"
netdev = "0.46"
socket2 = "0.6"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"], optional = true }
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect", "rustls-tls-webpki-roots"], optional = true }
webpki-roots = { version = "1", optional = true }
webrtc = "0.21.1"

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
tokio = { version = "1", features = ["io-util", "macros", "rt-multi-thread", "time"] }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
tokio = { version = "1", features = ["io-util"] }
wasm-bindgen-test = "0.3"

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.4", features = ["wasm_js"] }
getrandom03 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }
js-sys = "0.3"
send_wrapper = { version = "0.6", features = ["futures"] }
wasm-bindgen = "0.2.129"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3.106", features = [
    "BinaryType",
    "MessageEvent",
    "RtcConfiguration",
    "RtcDataChannel",
    "RtcDataChannelEvent",
    "RtcDataChannelType",
    "RtcIceCandidate",
    "RtcIceCandidateInit",
    "RtcIceServer",
    "RtcIceTransportPolicy",
    "RtcPeerConnection",
    "RtcPeerConnectionIceEvent",
    "RtcPeerConnectionState",
    "RtcSdpType",
    "RtcSessionDescription",
    "RtcSessionDescriptionInit",
    "RtcStatsReport",
    "WebSocket",
] }

[[test]]
name = "browser"
required-features = ["ws"]

[[test]]
name = "stats"
required-features = ["stats"]

[[test]]
name = "many_streams"
